<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily Grind Live</title>
<style>
:root{--acc:#f07800;--yel:#ffb81c;--bg:#fff8ea;--card:#fff;--ink:#141108;--mut:#6b5f45}
@media(prefers-color-scheme:dark){:root{--bg:#0e0c08;--card:#1a1610;--ink:#f6efe0;--mut:#b8a888}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,sans-serif}
header{background:#111;border-bottom:4px solid var(--acc);text-align:center;padding:12px}
h1{margin:0;color:#fff;text-transform:uppercase;letter-spacing:.04em}h1 b{color:var(--yel)}
nav{background:var(--acc);display:flex;gap:6px;overflow-x:auto;padding:6px 12px}
nav button{border:0;background:none;font:inherit;font-weight:700;padding:3px 12px;border-radius:99px;cursor:pointer;color:#111}
nav button.on{background:#111;color:var(--yel)}
main{max-width:1000px;margin:auto;padding:12px}
h2{border-left:5px solid var(--acc);padding-left:8px;text-transform:uppercase;font-size:1rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--card);border-radius:12px;overflow:hidden;border:1px solid rgba(120,120,120,.25)}
.card img{width:100%;height:160px;object-fit:cover;display:block;background:linear-gradient(135deg,var(--acc),#111)}
.card div{padding:10px}.card h3{margin:.2rem 0;font-size:1rem}.meta{color:var(--mut);font-size:.8rem}
a{color:inherit;text-decoration:none}.read{color:var(--acc);font-weight:700;font-size:.85rem}
.vid{position:relative;aspect-ratio:16/9;background:#000;cursor:pointer}.vid img{height:100%}.vid iframe{width:100%;height:100%;border:0}
.vid span{position:absolute;inset:0;display:grid;place-items:center;font-size:3rem;color:#fff}
footer{text-align:center;color:var(--mut);font-size:.8rem;padding:20px}
</style></head><body>
<header><h1>Daily <b>Grind</b> Live</h1><div class="meta" id="upd" style="color:#ffb81c"></div></header>
<nav id="nav"></nav><main id="app"></main>
<footer>Headlines, pictures and videos belong to their sources. Tap a story to read it on the original site.</footer>
<script>
let D={stories:[],videos:[]},region="";
const R=["","Uganda","Africa","World"],$=s=>document.querySelector(s);
const ago=t=>{const m=Math.round((Date.now()-t)/6e4);return m<60?m+" min ago":m<1440?Math.round(m/60)+" h ago":Math.round(m/1440)+" d ago"};
function el(t,a,...k){const e=document.createElement(t);for(const x in a||{})x==="class"?e.className=a[x]:x.startsWith("on")?e[x]=a[x]:e.setAttribute(x,a[x]);k.flat().forEach(c=>c!=null&&e.append(c));return e}
function render(){
 $("#nav").replaceChildren(...R.map(r=>el("button",{class:r===region?"on":"",onclick:()=>{region=r;render()}},r||"All")));
 $("#upd").textContent=D.updated?"Updated "+ago(D.updated):"";
 const S=D.stories.filter(s=>!region||s.region===region),w=el("div");
 w.append(el("h2",{},"Latest news"),el("div",{class:"grid"},S.map(s=>el("a",{class:"card",href:s.link,target:"_blank",rel:"noopener"},
  s.image?el("img",{src:s.image,alt:"",loading:"lazy",referrerpolicy:"no-referrer",onerror:function(){this.removeAttribute("src")}}):el("img",{alt:""}),
  el("div",{},el("div",{class:"meta"},s.source+" · "+s.region+" · "+ago(s.ts)),el("h3",{},s.title),el("div",{class:"meta"},s.summary),el("span",{class:"read"},"Read at "+s.source+" →"))))));
 if(D.videos.length)w.append(el("h2",{},"Videos"),el("div",{class:"grid"},D.videos.map(v=>{
  const b=el("div",{class:"vid",onclick:()=>b.replaceChildren(el("iframe",{src:"https://www.youtube-nocookie.com/embed/"+v.id+"?autoplay=1",allow:"autoplay; encrypted-media; picture-in-picture",allowfullscreen:""}))},
   el("img",{src:"https://i.ytimg.com/vi/"+v.id+"/hqdefault.jpg",alt:"",loading:"lazy"}),el("span",{},"▶"));
  return el("div",{class:"card"},b,el("div",{},el("div",{class:"meta"},v.source+" · "+ago(v.ts)),el("h3",{},v.title)))})));
 $("#app").replaceChildren(w)}
async function load(){try{D=await (await fetch("news.json?"+Date.now())).json()}catch(e){}render()}
load();setInterval(load,600000);
</script></body></html>
